[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nda-sanitizer"
version = "0.1.0"
description = "Offline-first prompt sanitizer with deterministic, PII, and local LLM layers"
requires-python = ">=3.10"
dependencies = [
  "detect-secrets>=1.5,<2",
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "spacy>=3.7,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-rerunfailures>=14,<17",
]

[project.scripts]
nda-sanitizer = "src.sanitizer:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a running local llama-server",
  "flaky: probabilistic local-model assertion",
]

