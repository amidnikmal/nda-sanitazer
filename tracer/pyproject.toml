[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-tracer"
version = "0.1.0"
description = "Local code-insight tracer: index a project and answer where to look."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.22,<0.24",
    "tree-sitter-language-pack==0.8.0",
    "rich>=13.0",
    "typer>=0.12",
    "tomli>=2.0 ; python_version < '3.11'",
    "tomli-w>=1.0",
    "pathspec>=0.11",
]

[project.optional-dependencies]
embed = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8.0"]

[project.scripts]
code-tracer = "code_tracer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_tracer = ["../static/*.html"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running llama-server on 127.0.0.1:8080 (auto-skipped)",
]
testpaths = ["tests"]
